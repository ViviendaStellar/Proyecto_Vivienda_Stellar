<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Control de avance de obra por etapas, registrado en la red de Stellar." />
    <title>Avance de Obra · Stellar</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Esqueleto de la página. Cada elemento con data-mount se llena con el
      componente del mismo nombre en src/components/ (ver src/app.js).
    -->
    <div class="app">
      <aside class="sidebar" data-mount="sidebar"></aside>
      <div class="scrim"></div>

      <div class="main">
        <header class="topbar" data-mount="topbar"></header>

        <main class="content">
          <section class="project-hero" id="resumen" data-mount="project-hero"></section>
          <section class="card onboarding" data-mount="onboarding"></section>
          <section class="stats" data-mount="stats"></section>

          <div class="columns">
            <section class="card table-card" id="etapas" data-mount="stage-table"></section>
            <div class="aside-col">
              <section class="card side-card" id="actividad" data-mount="activity"></section>
              <section class="card side-card" id="consultar" data-mount="query-card"></section>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div data-mount="create-stage-drawer"></div>
    <div data-mount="progress-drawer"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
