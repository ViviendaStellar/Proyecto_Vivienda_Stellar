<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="cabecera" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14306B"/>
      <stop offset="1" stop-color="#3B5BDB"/>
    </linearGradient>
    <linearGradient id="entrada" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24478F"/>
      <stop offset="1" stop-color="#14306B"/>
    </linearGradient>
    <linearGradient id="verde" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16A06F"/>
      <stop offset="1" stop-color="#0B6B4C"/>
    </linearGradient>
    <linearGradient id="decision" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6CC"/>
      <stop offset="1" stop-color="#FFE38A"/>
    </linearGradient>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8C99B0"/>
    </marker>
    <filter id="sombra" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#14306B" flood-opacity="0.13"/>
    </filter>
    <clipPath id="marco">
      <rect x="0" y="0" width="1200" height="670" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#marco)">
  <rect x="0" y="0" width="1200" height="670" fill="#FFFFFF"/>

  <!-- ================= CABECERA ================= -->
  <rect x="0" y="0" width="1200" height="92" fill="url(#cabecera)"/>
  <text x="36" y="50" font-size="25" font-weight="700" fill="#FFFFFF">Flujo de usuario</text>
  <text x="36" y="74" font-size="13.5" fill="#DCE4F7">Vivienda sobre planos: el dinero solo se mueve cuando la obra avanza</text>
  <rect x="908" y="34" width="258" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.16"/>
  <text x="1037" y="53" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">7 pasos  ·  6 roles  ·  2 escenarios</text>

  <!-- ================= PANELES DE FASE ================= -->
  <rect x="30" y="116" width="210" height="184" rx="16" fill="#F1F4FA" stroke="#C9D3E6"/>
  <rect x="46" y="130" width="80" height="22" rx="11" fill="#14306B"/>
  <text x="86" y="145" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">ENTRADA</text>

  <rect x="260" y="116" width="680" height="184" rx="16" fill="#F3F6FE" stroke="#CBD7F7"/>
  <rect x="276" y="130" width="76" height="22" rx="11" fill="#3B5BDB"/>
  <text x="314" y="145" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">APORTE</text>
  <text x="362" y="145" font-size="12" fill="#5B6B85">El dinero entra y queda retenido</text>

  <rect x="960" y="116" width="210" height="184" rx="16" fill="#FAFBFD" stroke="#E1E6EF"/>
  <rect x="976" y="130" width="64" height="22" rx="11" fill="#495057"/>
  <text x="1008" y="145" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">ROLES</text>

  <rect x="30" y="330" width="760" height="280" rx="16" fill="#FFF8F1" stroke="#F5D4B3"/>
  <rect x="46" y="344" width="112" height="22" rx="11" fill="#C2560A"/>
  <text x="102" y="359" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">VERIFICACIÓN</text>
  <text x="168" y="359" font-size="12" fill="#7A5A35">La obra se comprueba y el dinero se libera</text>

  <rect x="810" y="330" width="360" height="280" rx="16" fill="#F0FAF5" stroke="#BDE5D2"/>
  <rect x="826" y="344" width="72" height="22" rx="11" fill="#0E6B4F"/>
  <text x="862" y="359" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">SALIDA</text>
  <text x="908" y="359" font-size="12" fill="#3F6B58">El problema queda resuelto</text>

  <!-- ================= CONECTORES ================= -->
  <g stroke="#8C99B0" stroke-width="2" fill="none" marker-end="url(#flecha)" stroke-linecap="round" stroke-linejoin="round">
    <line x1="225" y1="223" x2="275" y2="223"/>
    <line x1="460" y1="223" x2="505" y2="223"/>
    <line x1="690" y1="223" x2="735" y2="223"/>
    <path d="M830,288 V316 H16 V465 H45"/>
    <line x1="230" y1="465" x2="255" y2="465"/>
    <line x1="440" y1="465" x2="453" y2="465"/>
    <path d="M582,465 H590 V428 H595"/>
    <path d="M590,465 V544 H595"/>
    <line x1="780" y1="428" x2="821" y2="428"/>
    <line x1="780" y1="544" x2="821" y2="544"/>
    <line x1="1016" y1="428" x2="1027" y2="428"/>
    <line x1="1016" y1="544" x2="1027" y2="544"/>
  </g>
  <text x="564" y="448" font-size="12" font-weight="700" fill="#0E6B4F">Sí</text>
  <text x="564" y="492" font-size="12" font-weight="700" fill="#C92A2A">No</text>

  <!-- ================= FILA 1 ================= -->
  <!-- Entrada: registrar proyecto -->
  <g filter="url(#sombra)">
    <rect x="45" y="158" width="180" height="130" rx="14" fill="url(#entrada)"/>
  </g>
  <circle cx="135" cy="208" r="24" fill="#FFFFFF" fill-opacity="0.16"/>
  <text x="135" y="217" font-size="24" text-anchor="middle">🏗️</text>
  <text x="135" y="254" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Registrar proyecto</text>
  <rect x="89" y="264" width="92" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.18"/>
  <text x="135" y="277" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Constructora</text>

  <!-- Paso 1 -->
  <g filter="url(#sombra)">
    <rect x="280" y="158" width="180" height="130" rx="14" fill="#FFFFFF" stroke="#E4E9F2"/>
  </g>
  <rect x="298" y="158" width="144" height="4" rx="2" fill="#3B5BDB"/>
  <circle cx="302" cy="182" r="12" fill="#3B5BDB"/>
  <text x="302" y="186" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="370" cy="208" r="24" fill="#E7EEFC"/>
  <text x="370" y="217" font-size="24" text-anchor="middle">👩</text>
  <text x="370" y="254" font-size="15" font-weight="700" fill="#1B2433" text-anchor="middle">Separar apartamento</text>
  <rect x="326" y="264" width="88" height="18" rx="9" fill="#E7EEFC"/>
  <text x="370" y="277" font-size="10.5" font-weight="700" fill="#3B5BDB" text-anchor="middle">Compradora</text>

  <!-- Paso 2 -->
  <g filter="url(#sombra)">
    <rect x="510" y="158" width="180" height="130" rx="14" fill="#FFFFFF" stroke="#E4E9F2"/>
  </g>
  <rect x="528" y="158" width="144" height="4" rx="2" fill="#3B5BDB"/>
  <circle cx="532" cy="182" r="12" fill="#3B5BDB"/>
  <text x="532" y="186" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="600" cy="208" r="24" fill="#E7EEFC"/>
  <text x="600" y="217" font-size="24" text-anchor="middle">👩</text>
  <text x="600" y="254" font-size="15" font-weight="700" fill="#1B2433" text-anchor="middle">Pagar cuota</text>
  <rect x="556" y="264" width="88" height="18" rx="9" fill="#E7EEFC"/>
  <text x="600" y="277" font-size="10.5" font-weight="700" fill="#3B5BDB" text-anchor="middle">Compradora</text>

  <!-- Paso 3 -->
  <g filter="url(#sombra)">
    <rect x="740" y="158" width="180" height="130" rx="14" fill="#FFFFFF" stroke="#E4E9F2"/>
  </g>
  <rect x="758" y="158" width="144" height="4" rx="2" fill="#7048E8"/>
  <circle cx="762" cy="182" r="12" fill="#7048E8"/>
  <text x="762" y="186" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="830" cy="208" r="24" fill="#F0EBFF"/>
  <text x="830" y="217" font-size="24" text-anchor="middle">🏦</text>
  <text x="830" y="254" font-size="15" font-weight="700" fill="#1B2433" text-anchor="middle">Retener dinero</text>
  <rect x="790" y="264" width="80" height="18" rx="9" fill="#F0EBFF"/>
  <text x="830" y="277" font-size="10.5" font-weight="700" fill="#7048E8" text-anchor="middle">Fiduciaria</text>

  <!-- Leyenda -->
  <circle cx="990" cy="170" r="10" fill="#FFF0E6"/>
  <text x="990" y="174" font-size="11" text-anchor="middle">🏗️</text>
  <text x="1008" y="174" font-size="12.5" fill="#33415C">Constructora</text>
  <circle cx="990" cy="192" r="10" fill="#E7EEFC"/>
  <text x="990" y="196" font-size="11" text-anchor="middle">👩</text>
  <text x="1008" y="196" font-size="12.5" fill="#33415C">Compradora</text>
  <circle cx="990" cy="214" r="10" fill="#F0EBFF"/>
  <text x="990" y="218" font-size="11" text-anchor="middle">🏦</text>
  <text x="1008" y="218" font-size="12.5" fill="#33415C">Fiduciaria</text>
  <circle cx="990" cy="236" r="10" fill="#E3F7FA"/>
  <text x="990" y="240" font-size="11" text-anchor="middle">🦺</text>
  <text x="1008" y="240" font-size="12.5" fill="#33415C">Interventor</text>
  <circle cx="990" cy="258" r="10" fill="#E6ECF5"/>
  <text x="990" y="262" font-size="11" text-anchor="middle">💻</text>
  <text x="1008" y="262" font-size="12.5" fill="#33415C">Plataforma</text>
  <circle cx="990" cy="280" r="10" fill="#F1F3F5"/>
  <text x="990" y="284" font-size="11" text-anchor="middle">⚖️</text>
  <text x="1008" y="284" font-size="12.5" fill="#33415C">Superintendencia</text>

  <!-- ================= FILA 2 ================= -->
  <!-- Paso 4 -->
  <g filter="url(#sombra)">
    <rect x="50" y="400" width="180" height="130" rx="14" fill="#FFFFFF" stroke="#E4E9F2"/>
  </g>
  <rect x="68" y="400" width="144" height="4" rx="2" fill="#E8590C"/>
  <circle cx="72" cy="424" r="12" fill="#E8590C"/>
  <text x="72" y="428" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <circle cx="140" cy="444" r="22" fill="#FFF0E6"/>
  <text x="140" y="452" font-size="22" text-anchor="middle">🏗️</text>
  <text x="140" y="486" font-size="15" font-weight="700" fill="#1B2433" text-anchor="middle">Registrar avance</text>
  <text x="140" y="502" font-size="10.5" fill="#7A5A35" text-anchor="middle" font-family="Consolas, Menlo, monospace"># huella digital (hash)</text>
  <rect x="96" y="510" width="88" height="16" rx="8" fill="#FFF0E6"/>
  <text x="140" y="522" font-size="10" font-weight="700" fill="#E8590C" text-anchor="middle">Constructora</text>

  <!-- Paso 5 -->
  <g filter="url(#sombra)">
    <rect x="260" y="400" width="180" height="130" rx="14" fill="#FFFFFF" stroke="#E4E9F2"/>
  </g>
  <rect x="278" y="400" width="144" height="4" rx="2" fill="#0C8599"/>
  <circle cx="282" cy="424" r="12" fill="#0C8599"/>
  <text x="282" y="428" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <circle cx="350" cy="450" r="24" fill="#E3F7FA"/>
  <text x="350" y="459" font-size="24" text-anchor="middle">🦺</text>
  <text x="350" y="496" font-size="15" font-weight="700" fill="#1B2433" text-anchor="middle">Certificar avance</text>
  <rect x="308" y="506" width="84" height="18" rx="9" fill="#E3F7FA"/>
  <text x="350" y="519" font-size="10.5" font-weight="700" fill="#0C8599" text-anchor="middle">Interventor</text>

  <!-- Decision -->
  <g filter="url(#sombra)">
    <polygon points="520,413 582,465 520,517 458,465" fill="url(#decision)" stroke="#F08C00" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <text x="520" y="462" font-size="12" font-weight="700" fill="#5C3D00" text-anchor="middle">¿Certificada</text>
  <text x="520" y="477" font-size="12" font-weight="700" fill="#5C3D00" text-anchor="middle">a tiempo?</text>

  <!-- Paso 6: liberar pago -->
  <g filter="url(#sombra)">
    <rect x="600" y="374" width="180" height="108" rx="14" fill="#FFFFFF" stroke="#E4E9F2"/>
  </g>
  <rect x="618" y="374" width="144" height="4" rx="2" fill="#14306B"/>
  <circle cx="620" cy="396" r="11" fill="#14306B"/>
  <text x="620" y="400" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <circle cx="690" cy="414" r="20" fill="#E6ECF5"/>
  <text x="690" y="421" font-size="20" text-anchor="middle">💻</text>
  <text x="690" y="454" font-size="14" font-weight="700" fill="#1B2433" text-anchor="middle">Liberar pago</text>
  <rect x="648" y="462" width="84" height="16" rx="8" fill="#E6ECF5"/>
  <text x="690" y="474" font-size="10" font-weight="700" fill="#14306B" text-anchor="middle">Plataforma</text>

  <!-- Paso 6: alertar compradora -->
  <g filter="url(#sombra)">
    <rect x="600" y="490" width="180" height="108" rx="14" fill="#FFF5F5" stroke="#F5C2C0"/>
  </g>
  <rect x="618" y="490" width="144" height="4" rx="2" fill="#E03131"/>
  <circle cx="620" cy="512" r="11" fill="#E03131"/>
  <text x="620" y="516" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <circle cx="690" cy="530" r="20" fill="#FFE3E3"/>
  <text x="690" y="537" font-size="20" text-anchor="middle">💻</text>
  <text x="690" y="570" font-size="14" font-weight="700" fill="#7A1C1C" text-anchor="middle">Alertar compradora</text>
  <rect x="648" y="578" width="84" height="16" rx="8" fill="#FFE3E3"/>
  <text x="690" y="590" font-size="10" font-weight="700" fill="#C92A2A" text-anchor="middle">Plataforma</text>

  <!-- Salida: si la obra avanza -->
  <g filter="url(#sombra)">
    <rect x="826" y="374" width="190" height="108" rx="16" fill="url(#verde)"/>
  </g>
  <rect x="840" y="386" width="124" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.2"/>
  <text x="902" y="399" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SI LA OBRA AVANZA</text>
  <text x="840" y="430" font-size="16" fill="#FFFFFF">✅</text>
  <text x="864" y="430" font-size="15" font-weight="700" fill="#FFFFFF">Obra verificada</text>
  <text x="840" y="451" font-size="11.5" fill="#E2F6EE">Ve qué etapa se certificó,</text>
  <text x="840" y="467" font-size="11.5" fill="#E2F6EE">cuánto salió y con qué prueba</text>

  <!-- Salida: si la obra se detiene -->
  <g filter="url(#sombra)">
    <rect x="826" y="490" width="190" height="108" rx="16" fill="url(#verde)"/>
  </g>
  <rect x="840" y="502" width="150" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.2"/>
  <text x="915" y="515" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SI LA OBRA SE DETIENE</text>
  <text x="840" y="546" font-size="16" fill="#FFFFFF">🛡️</text>
  <text x="864" y="546" font-size="15" font-weight="700" fill="#FFFFFF">Dinero protegido</text>
  <text x="840" y="567" font-size="11.5" fill="#E2F6EE">Conserva todo lo que</text>
  <text x="840" y="583" font-size="11.5" fill="#E2F6EE">aún no se había liberado</text>

  <!-- Paso 7: auditar ambos escenarios -->
  <g filter="url(#sombra)">
    <rect x="1032" y="374" width="126" height="224" rx="16" fill="#FFFFFF" stroke="#D5DAE1"/>
  </g>
  <circle cx="1052" cy="396" r="11" fill="#495057"/>
  <text x="1052" y="400" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
  <circle cx="1095" cy="456" r="26" fill="#F1F3F5"/>
  <text x="1095" y="465" font-size="24" text-anchor="middle">⚖️</text>
  <text x="1095" y="508" font-size="14" font-weight="700" fill="#1B2433" text-anchor="middle">Auditar</text>
  <text x="1095" y="525" font-size="14" font-weight="700" fill="#1B2433" text-anchor="middle">historial</text>
  <text x="1095" y="545" font-size="10.5" fill="#6B7280" text-anchor="middle">Revisa los dos</text>
  <text x="1095" y="559" font-size="10.5" fill="#6B7280" text-anchor="middle">escenarios</text>
  <rect x="1041" y="572" width="108" height="16" rx="8" fill="#F1F3F5"/>
  <text x="1095" y="584" font-size="10" font-weight="700" fill="#495057" text-anchor="middle">Superintendencia</text>

  <!-- ================= NOTA DEL CICLO ================= -->
  <rect x="30" y="626" width="1140" height="30" rx="15" fill="#F4F6FA"/>
  <text x="600" y="646" font-size="12.5" fill="#4A5874" text-anchor="middle">↻   El ciclo se repite en cada etapa de obra: con la siguiente cuota, el recorrido vuelve al paso 2.</text>
  </g>
</svg>
