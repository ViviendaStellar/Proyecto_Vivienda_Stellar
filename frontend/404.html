<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INN-LOCK · Página no encontrada</title>
<meta name="robots" content="noindex">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#F3F6FC;color:#0E1B3D;text-align:center;padding:24px}
  .box{max-width:420px}h1{font-size:28px;margin:0 0 8px}p{color:#4a5b7c;line-height:1.5}
  a.btn{display:inline-block;margin-top:14px;padding:12px 22px;border-radius:12px;background:#1450C8;color:#fff;text-decoration:none;font-weight:700}
</style>
<script>
  // GitHub Pages sirve esta página para cualquier ruta que no existe (enlaces antiguos, /docs/…, etc.).
  // Llevamos al visitante a la aplicación conservando ?code=… (confirmación de correo) y #/ruta.
  (function () {
    var parts = location.pathname.split('/').filter(Boolean);
    if (!parts.length) return;
    var app = '/' + parts[0] + '/';
    if (location.pathname !== app) location.replace(app + location.search + location.hash);   // si ya estamos en la raíz, no redirigir (evita bucles)
  })();
</script>
</head>
<body>
  <div class="box">
    <h1>Página no encontrada</h1>
    <p>La dirección que abriste no existe. Puedes entrar a INN-LOCK desde el botón.</p>
    <a class="btn" href="/Proyecto_Vivienda_Stellar/">Ir a INN-LOCK</a>
  </div>
</body>
</html>
